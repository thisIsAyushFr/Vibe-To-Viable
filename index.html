<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vibe To Viable</title>
  <style>
    .ai-fab {
      position: fixed;
      bottom: 28px;
      right: 32px;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(150deg, #2E9E90, #20756A);
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 50;
      border: none;
      transition: all 0.2s ease;
    }

    .ai-fab:hover {
      transform: scale(1.1);
    }

    .ai-fab svg {
      width: 26px;
      height: 26px;
      stroke: #fff;
    }

    .ai-panel {
      position: fixed;
      bottom: 104px;
      right: 32px;
      z-index: 50;
      width: 320px;
      background: #FFFFFF;
      border-radius: 20px;
      border: 1px solid #E2E8F0;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      opacity: 0;
      transform: translateY(10px) scale(.96);
      transform-origin: bottom right;
      pointer-events: none;
      transition: opacity .22s ease, transform .22s ease;
    }

    .ai-panel.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .ai-panel-inner {
      padding: 18px;
      display: flex;
      flex-direction: column;
    }

    .ai-panel-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .ai-panel-head .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #43A96B;
      flex-shrink: 0;
    }

    .ai-panel-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #17263B;
    }

    .ai-panel-close {
      margin-left: auto;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      color: #5E7186;
      padding: 2px;
    }

    .ai-chat-log {
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 12px;
    }

    .ai-chat-msg {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 14px;
      padding: 10px 13px;
      font-size: 12px;
      color: #17263B;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .ai-chat-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      background: #FFFFFF;
      border-top: 1px solid #E2E8F0;
      border-radius: 0 0 20px 20px;
    }

    .ai-chat-input {
      flex: 1;
      background: #F4F7FB;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 10px 13px;
      font-size: 12.5px;
      font-family: 'Inter', sans-serif;
      color: #17263B;
      outline: none;
    }

    .ai-chat-input::placeholder {
      color: #93A2B3;
    }

    .ai-chat-send {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: none;
      flex-shrink: 0;
      background: linear-gradient(150deg, #2E9E90, #20756A);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .ai-chat-send svg {
      width: 16px;
      height: 16px;
      stroke: #fff;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <button class="ai-fab" id="aiFab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 1 3 3v3a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v4M8 22h8"/></svg>
  </button>

  <div class="ai-panel" id="aiPanel">
    <div class="ai-panel-inner">
      <div class="ai-panel-head">
        <div class="dot"></div>
        <div class="ai-panel-title">CareSync AI</div>
        <button class="ai-panel-close" id="aiPanelClose">×</button>
      </div>
      <div class="ai-chat-log" id="aiChatLog"></div>
      <div class="ai-chat-input-row">
        <input type="text" class="ai-chat-input" id="aiChatInput" placeholder="Ask anything..." />
        <button class="ai-chat-send" id="aiChatSend">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/><path d="M21 8a3 3 0 0 1 0 6" stroke-width="2"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.jsx"></script>

  <script>
    const API_KEY = "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";

    async function sendMessageToAI(message) {
      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            messages: [
              {
                role: "system",
                content: "You are CareSync Hospital's helpful AI assistant. Answer patient and healthcare worker questions politely and briefly."
              },
              {
                role: "user",
                content: message
              }
            ],
            temperature: 0.7,
            max_tokens: 300
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        return data.choices[0].message.content;
      } catch (err) {
        console.error(err);
        return "Sorry, I couldn't reach the AI service.";
      }
    }

    const aiFab = document.getElementById("aiFab");
    const aiPanel = document.getElementById("aiPanel");
    const aiPanelClose = document.getElementById("aiPanelClose");
    const aiChatSend = document.getElementById("aiChatSend");
    const aiChatInput = document.getElementById("aiChatInput");
    const aiChatLog = document.getElementById("aiChatLog");

    aiFab.addEventListener("click", () => {
      aiPanel.classList.toggle("open");
    });

    aiPanelClose.addEventListener("click", () => {
      aiPanel.classList.remove("open");
    });

    async function sendMessage() {
      const message = aiChatInput.value.trim();
      if (!message) return;

      aiChatLog.innerHTML += `<div class="ai-chat-msg"><strong>You:</strong> ${message}</div>`;
      aiChatInput.value = "";
      aiChatLog.scrollTop = aiChatLog.scrollHeight;

      aiChatLog.innerHTML += `<div class="ai-chat-msg" id="thinking"><strong>AI:</strong> Thinking...</div>`;
      aiChatLog.scrollTop = aiChatLog.scrollHeight;

      const aiReply = await sendMessageToAI(message);
      document.getElementById("thinking").remove();

      aiChatLog.innerHTML += `<div class="ai-chat-msg"><strong>AI:</strong> ${aiReply}</div>`;
      aiChatLog.scrollTop = aiChatLog.scrollHeight;
    }

    aiChatSend.addEventListener("click", sendMessage);
    aiChatInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        sendMessage();
      }
    });
  </script>
</body>
</html>
